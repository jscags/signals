# Diagnostic only. Answers a design question -- how much repurchase data is
# actually tagged in XBRL -- before a collector is built on the assumption.
# Never scheduled, writes nothing, commits nothing.

name: probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which probe: buybacks, contracts, setup, setup-population, sic or gauges'
        default: 'buybacks'
      sample:
        description: 'Sample size, or a CIK for the setup probe (Axon = 1069183)'
        default: '60'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the probe
        env:
          EDGAR_USER_AGENT: "edgar-discovery 52y9fp5njf@privaterelay.appleid.com"
          TARGET: ${{ inputs.target }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          TARGET="${TARGET:-buybacks}"
          SAMPLE="${SAMPLE:-60}"
          # Most probes take a sample size. The gauge probe does not -- it
          # fetches a fixed set of sources -- and appending one to a flag that
          # accepts no value fails argument parsing before a single request is
          # made. Which is the right failure, but only if the caller does not
          # keep handing it an argument it never asked for.
          if [ "$TARGET" = "gauges" ]; then
            python3 edgar_discovery.py --probe-gauges
          else
            python3 edgar_discovery.py "--probe-${TARGET}" "$SAMPLE"
          fi
