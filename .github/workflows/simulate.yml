# Reconstruct historical signals and measure what they were worth.
#
# This deliberately does NOT touch discovery.db. Backfilling historical days
# through the collector would drive the state machine with today's clock and
# write transitions dated now for filings from months ago -- corrupting the
# live state to answer a research question. So it builds a separate history.db
# from scratch, and the live collection never sees it.
#
# The history and price databases are carried between runs in the ACTIONS
# CACHE rather than committed: both are large, both are reproducible from their
# sources at any time, and neither is state the screener depends on. Only the
# result -- a small JSON file -- is kept as an artifact, because that is the
# thing someone downloads and reads.

name: simulate

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Earliest filing day to reconstruct (YYYY-MM-DD)'
        required: true
      until:
        description: 'Latest filing day to reconstruct (YYYY-MM-DD). Blank = today.'
        default: ''
      limit:
        description: 'Max documents per day (blank = no cap; a cap biases the sample)'
        default: ''
      stage:
        description: 'collect | measure | both | audit (audit is read-only)'
        default: 'both'
      source:
        description: 'ledger (insider Form 4) | setup (Lane A streak) | transitions'
        default: 'ledger'
      threshold:
        description: 'Lane A: consecutive quarters required'
        default: '6'
      issuers:
        description: 'Lane A: cap the universe for a smoke run (blank = all)'
        default: ''
      roles:
        description: 'Compare roles instead of the override contrast: ceo,cfo,ceo_cfo,director'
        default: ''
      split_size:
        description: 'Split each group by liquidity tier (true/false)'
        default: 'false'

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Resume from whatever a previous run got through. A backfill that dies
      # at hour six must not start from zero on the retry, and prices already
      # paid for at five requests a minute must not be re-fetched.
      #
      # CACHE, not download-artifact. download-artifact@v4 reads only the
      # CURRENT run's artifacts unless given a run-id, so the first version of
      # this restored nothing at all -- and because it was wrapped in
      # continue-on-error, it reported success while doing nothing, and the
      # measure stage then failed with "no history.db" on a database that had
      # been collected perfectly well five days earlier. A cache keyed per run
      # with a shared restore prefix always writes a new entry and always
      # restores the newest one.
      - name: Restore databases
        uses: actions/cache@v4
        with:
          path: |
            history.db
            prices.db
          key: sim-db-${{ github.run_id }}
          restore-keys: |
            sim-db-

      - name: Report what was restored
        run: |
          for f in history.db prices.db; do
            if [ -f "$f" ]; then
              echo "restored $f ($(du -h $f | cut -f1))"
            else
              echo "no $f carried over; starting fresh"
            fi
          done

      # Named stages, not "not the other one". These were `!= 'measure'` and
      # `!= 'collect'`, which meant ANY new stage value silently ran both --
      # so adding `audit` would have started a five-hour backfill on a run
      # asked only to inspect what was already there.
      - name: Reconstruct filings
        if: ${{ github.event.inputs.stage == 'collect' || github.event.inputs.stage == 'both' }}
        env:
          EDGAR_USER_AGENT: "edgar-discovery 52y9fp5njf@privaterelay.appleid.com"
          EDGAR_DB: history.db
        run: |
          set -u
          SINCE="${{ github.event.inputs.since }}"
          UNTIL="${{ github.event.inputs.until }}"
          LIMIT="${{ github.event.inputs.limit }}"
          [ -z "$UNTIL" ] && UNTIL=$(date -u +%Y-%m-%d)
          echo "reconstructing $SINCE .. $UNTIL into history.db"

          python3 - "$SINCE" "$UNTIL" > days.txt <<'PY'
          import sys
          from datetime import date, timedelta
          a = date.fromisoformat(sys.argv[1]); b = date.fromisoformat(sys.argv[2])
          d = a
          while d <= b:
              if d.weekday() < 5:
                  print(d.isoformat())
              d += timedelta(days=1)
          PY
          echo "$(wc -l < days.txt) weekdays to scan"

          # Sequential and unhurried: the collector paces itself against the
          # SEC's limit internally, and one bad day must not stop the run.
          #
          # But tolerating every failure is how a backfill reports success over
          # an empty database. The first attempt did exactly that: all ten days
          # died on an unset user agent, each was shrugged off, and the stage
          # went green over 132KB of nothing. So failures are COUNTED, and a
          # run that lost more than half its days is a failed run.
          # A SELF-IMPOSED time budget, well inside the job timeout.
          #
          # This is not belt-and-braces, it is the difference between partial
          # progress and none. actions/cache saves in a POST step, and GitHub
          # skips post steps when it cancels a job for timeout -- so a run that
          # overshoots loses everything it collected. One chunk ran five hours
          # and fifty minutes, was cancelled, and saved nothing at all.
          #
          # Stopping early and exiting 0 lets the job finish normally, the
          # cache save runs, and the next dispatch resumes: the collector skips
          # days already in run_log, so nothing is re-fetched. That makes the
          # chunk size a preference rather than a constraint.
          BUDGET_SECONDS=${BUDGET_SECONDS:-16200}      # 4h30m of a 5h50m cap
          START=$(date +%s)
          OK=0; BAD=0; LEFT=0
          while read -r DAY; do
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge "$BUDGET_SECONDS" ]; then
              LEFT=$((LEFT+1))
              continue
            fi
            echo "── $DAY"
            if [ -n "$LIMIT" ]; then
              python3 edgar_discovery.py --date "$DAY" --limit "$LIMIT" && OK=$((OK+1)) || { BAD=$((BAD+1)); echo "  (day failed)"; }
            else
              python3 edgar_discovery.py --date "$DAY" && OK=$((OK+1)) || { BAD=$((BAD+1)); echo "  (day failed)"; }
            fi
          done < days.txt

          echo "collected $OK day(s), $BAD failed; history.db is $(du -h history.db | cut -f1)"
          if [ "$LEFT" -gt 0 ]; then
            echo "::warning::stopped on the time budget with $LEFT day(s) still"
            echo "::warning::to scan. This run is SAVED -- dispatch the same"
            echo "::warning::window again and it will resume where it stopped."
          fi
          if [ "$OK" -eq 0 ]; then
            echo "::error::every day failed -- the database is empty and any"
            echo "::error::measurement over it would be meaningless"
            exit 1
          fi
          if [ "$BAD" -gt "$OK" ]; then
            echo "::error::more days failed ($BAD) than succeeded ($OK); the"
            echo "::error::sample is too holed to measure"
            exit 1
          fi

      # Read-only. Proves the window is dense before anything is measured over
      # it -- MIN..MAX is a range, not coverage, and a backfill that died mid
      # window leaves endpoints that look perfect either way.
      - name: Audit continuity
        if: ${{ github.event.inputs.stage == 'audit' }}
        env:
          EDGAR_DB: history.db
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: python3 audit_continuity.py

      - name: Measure
        if: ${{ github.event.inputs.stage == 'measure' || github.event.inputs.stage == 'both' }}
        env:
          EDGAR_DB: history.db
          PRICE_DB: prices.db
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          # --source setup fetches companyfacts from data.sec.gov, which
          # refuses requests without a declared contact. The collect step has
          # always had this; the measure step never needed it until now.
          EDGAR_USER_AGENT: "edgar-discovery 52y9fp5njf@privaterelay.appleid.com"
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          if [ -z "${POLYGON_API_KEY}" ]; then
            echo "::error::POLYGON_API_KEY is not set. Add it under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            echo "::error::Stooq cannot be used here: it refuses this runner's"
            echo "::error::datacenter IP with a JavaScript challenge."
            exit 1
          fi
          python3 - <<'PY'
          import os, sqlite3
          p = "history.db"
          if not os.path.exists(p):
              raise SystemExit("no history.db -- run the collect stage first")
          c = sqlite3.connect(p)
          for t in ("documents", "insider_buys", "insider_sales"):
              n = c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
              lo, hi = c.execute(
                  f"SELECT MIN(filed_date), MAX(filed_date) FROM documents").fetchone()
              print(f"{t:<15}{n:>8} rows   (filings {lo} .. {hi})")
          PY

          # Prices first, by grouped day: one request covers every US ticker
          # for that date, so the whole window costs ~190 requests instead of
          # one per ticker. It also prices companies delisted since, which the
          # per-ticker endpoint will not -- and those are exactly the names a
          # survivorship-blind backtest loses.
          #
          # The horizon runs past the last signal, so prices are fetched well
          # beyond it: a 63-session forward return needs about three further
          # months of bars to exist.
          python3 - <<'PY'
          import os
          from datetime import date, timedelta
          import market_data as md

          since = os.environ["SINCE"]
          until = os.environ.get("UNTIL") or date.today().isoformat()
          end = min(date.today(),
                    date.fromisoformat(until) + timedelta(days=120)).isoformat()
          conn = md.connect()
          print(f"prices {since} .. {end} (grouped daily)")
          got, empty, failed = md.refresh_grouped(conn, since, end)
          print(f"  {got} trading days, {empty} empty, {failed} failed")
          n = conn.execute("SELECT COUNT(*) FROM prices").fetchone()[0]
          t = conn.execute("SELECT COUNT(DISTINCT ticker) FROM prices").fetchone()[0]
          print(f"  {n:,} bars across {t:,} tickers")
          PY

          # --until is passed through. simulator.py has always accepted it and
          # this workflow has always dropped it, so every measurement so far
          # has run from `since` to the end of the database. That silently
          # rules out the one thing an out-of-sample test needs: holding back
          # the period the rules were written against. A blended window cannot
          # answer whether the signal survives outside the sample, however many
          # months it spans.
          SOURCE="${{ github.event.inputs.source }}"
          ARGS="--source ${SOURCE:-ledger} --since ${{ github.event.inputs.since }} --json simulation.json"
          if [ "$SOURCE" = "setup" ]; then
            ARGS="$ARGS --threshold ${{ github.event.inputs.threshold }}"
            if [ -n "${{ github.event.inputs.issuers }}" ]; then
              ARGS="$ARGS --issuers ${{ github.event.inputs.issuers }}"
            fi
          fi
          if [ -n "${UNTIL}" ]; then
            ARGS="$ARGS --until ${UNTIL}"
          fi
          [ -n "${{ github.event.inputs.roles }}" ] && ARGS="$ARGS --roles ${{ github.event.inputs.roles }}"
          [ "${{ github.event.inputs.split_size }}" = "true" ] && ARGS="$ARGS --split-size"
          echo "simulator.py $ARGS"
          python3 simulator.py $ARGS

      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-result
          path: simulation.json
          retention-days: 90
