# Save this in your repo as: .github/workflows/discovery.yml

name: discovery

on:
  schedule:
    # GitHub Actions evaluates cron in UTC only -- there is no timezone key and
    # no DST handling, so the ET times below are pinned to EST (UTC-5). Through
    # EDT each run lands an hour later in local terms (08:00 / 22:00 ET), which
    # is the safe direction: the evening run must not fire before the daily
    # index is published.
    #
    # 07:00 EST / 08:00 EDT -- morning pass over the last few weekdays
    - cron: '0 12 * * 1-5'
    # 21:00 EST / 22:00 EDT -- evening pass. Mon-Fri evenings ET fall on
    # Tue-Sat in UTC, hence 2-6 rather than 1-5.
    - cron: '0 2 * * 2-6'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Weekdays to scan'
        default: '3'
      limit:
        description: 'Max documents per day for this manual run (scheduled runs use 500)'
        default: '40'
      transition_cap:
        description: 'State transitions the dashboard reads before truncating (blank = built-in default)'
        default: ''

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Prints the checkout contents before doing anything else, so if the
      # script is missing or misnamed the log says so plainly.
      - name: Diagnostics
        run: |
          echo "--- python ---"
          python3 --version
          echo "--- repo root ---"
          ls -la
          echo "--- script syntax ---"
          python3 -m py_compile edgar_discovery.py && echo "edgar_discovery.py compiles"

      - name: Collect filings
        env:
          EDGAR_USER_AGENT: "edgar-discovery 52y9fp5njf@privaterelay.appleid.com"
          BACKFILL: ${{ inputs.backfill }}
          LIMIT: ${{ inputs.limit }}
          TRANSITION_CAP: ${{ inputs.transition_cap }}
        run: |
          mkdir -p docs
          # A schedule event carries no inputs at all, so both arrive empty and
          # the shell defaults below are what a scheduled run actually uses.
          #
          # The defaulting lives here rather than in a workflow expression for
          # one reason: a dispatch substitutes an input's declared default for a
          # blank field, so the expression form cannot be exercised outside a
          # real scheduled fire. Plain shell treats absent and empty alike and
          # can be run directly. An unverifiable default is how this went out
          # uncapped in the first place.
          #
          # (Expression delimiters are parsed anywhere in this block, comments
          # included, so an empty one here is a workflow syntax error.)
          #
          # 500/day is chosen, not guessed. A filing day sits in the
          # --backfill 3 window for three business days, which is six scheduled
          # runs, and already_processed means each run advances rather than
          # repeats. 500 x 6 = 3,000 slots against a day's ~1,300 candidates, so
          # a day is fully covered before it slides out, with margin to spare.
          # For a deliberate uncapped sweep, dispatch with a large number.
          BACKFILL="${BACKFILL:-3}"
          LIMIT="${LIMIT:-500}"
          ARGS="--backfill $BACKFILL --html docs/index.html --limit $LIMIT"
          # Left blank on a scheduled run and on a dispatch that does not set
          # it, in which case the collector's own default stands. Only appended
          # when a value was actually typed, so there is one default rather
          # than two that can drift apart.
          if [ -n "$TRANSITION_CAP" ]; then
            ARGS="$ARGS --transition-cap $TRANSITION_CAP"
          fi
          echo "running: python3 edgar_discovery.py $ARGS"
          python3 edgar_discovery.py $ARGS

      - name: Commit state and dashboard
        run: |
          git config user.name  "discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery.db docs/index.html
          if git diff --staged --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "discovery: $(date -u +%Y-%m-%d)"
          git push
