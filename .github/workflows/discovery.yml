# Save this in your repo as: .github/workflows/discovery.yml

name: discovery

on:
  schedule:
    # GitHub Actions evaluates cron in UTC only -- there is no timezone key and
    # no DST handling, so the ET times below are pinned to EST (UTC-5). Through
    # EDT each run lands an hour later in local terms (08:00 / 22:00 ET), which
    # is the safe direction: the evening run must not fire before the daily
    # index is published.
    #
    # 07:00 EST / 08:00 EDT -- morning pass over the last few weekdays
    - cron: '0 12 * * 1-5'
    # 21:00 EST / 22:00 EDT -- evening pass. Mon-Fri evenings ET fall on
    # Tue-Sat in UTC, hence 2-6 rather than 1-5.
    - cron: '0 2 * * 2-6'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Weekdays to scan'
        default: '3'
      limit:
        description: 'Max documents (blank = no cap)'
        default: '40'

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Prints the checkout contents before doing anything else, so if the
      # script is missing or misnamed the log says so plainly.
      - name: Diagnostics
        run: |
          echo "--- python ---"
          python3 --version
          echo "--- repo root ---"
          ls -la
          echo "--- script syntax ---"
          python3 -m py_compile edgar_discovery.py && echo "edgar_discovery.py compiles"

      - name: Collect filings
        env:
          EDGAR_USER_AGENT: "edgar-discovery 52y9fp5njf@privaterelay.appleid.com"
          BACKFILL: ${{ inputs.backfill || '3' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p docs
          ARGS="--backfill $BACKFILL --html docs/index.html"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "running: python3 edgar_discovery.py $ARGS"
          python3 edgar_discovery.py $ARGS

      - name: Commit state and dashboard
        run: |
          git config user.name  "discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery.db docs/index.html
          if git diff --staged --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "discovery: $(date -u +%Y-%m-%d)"
          git push
