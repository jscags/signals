name: discovery

on:
  schedule:
    - cron: '0 7 * * 1-5'          # morning: overnight 8-Ks, pre-market deals
      timezone: 'America/New_York'
    - cron: '0 21 * * 1-5'         # evening: Form 4s, post-close 8-Ks
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Weekdays to scan'
        default: '2'
      limit:
        description: 'Max documents (blank = no cap)'
        default: ''

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect filings
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          BACKFILL: ${{ inputs.backfill || '2' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p docs
          ARGS="--backfill $BACKFILL --html docs/index.html"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python edgar_discovery.py $ARGS

      - name: Commit state and dashboard
        run: |
          git config user.name  "discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery.db docs/index.html
          if git diff --staged --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "discovery: $(date -u +%Y-%m-%d)"
          git push
